<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>VMT Tickets</title>
    <meta name="theme-color" content="#f5f6f5">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" href="apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="VMT Tickets">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Contenedor de la app cargando por detrás */
        #app-wrapper {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background-color: #f5f6f5;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
            overflow: hidden;
        }
        #app-wrapper.visible {
            opacity: 1;
            pointer-events: auto;
        }
        #app-wrapper iframe {
            position: absolute;
            top: -92px; /* Esconde el banner de Google Apps Script */
            left: 0;
            width: 100%;
            height: calc(100% + 92px);
            border: none;
        }
    </style>
</head>
<body>
    <!-- CABECERA -->
    <header class="topbar">
        <div class="brand">
            <span class="brand-vmt">VMT</span>
            <span class="brand-company">Pepperl+Fuchs</span>
        </div>
        <span class="internal-label">GESTIÓN INTERNA</span>
    </header>

    <!-- PANTALLA DE BIENVENIDA CON TU ANIMACIÓN MATRIX -->
    <main>
        <img class="app-icon" src="apple-touch-icon.png" alt="VMT Tickets">
        <h1 id="matrix-title">VMT Tickets</h1>
        <p class="subtitle">Gestión y registro de tickets</p>
    </main>

    <!-- PIE DE PÁGINA -->
    <footer>
        <span class="footer-company">Pepperl+Fuchs</span>
        <span class="footer-tagline">Tus gastos, simplificados</span>
    </footer>

    <!-- TU APP CARGANDO EN SEGUNDO PLANO -->
    <div id="app-wrapper">
        <iframe 
            src="https://script.google.com/macros/s/AKfycbzE0MpgQZPdkIdwGzgLK6EM918Sl2YxcIjb_k-BMrMDqts-pWazjrditaP3aUznfjoM-A/exec" 
            allow="camera; microphone">
        </iframe>
    </div>

    <!-- TU SCRIPT ORIGINAL INTACTO -->
    <script src="script.js"></script>

    <!-- TRANSICIÓN EXACTA AL TERMINAR EL DESCIFRADO (850ms + 1500ms + 450ms de pausa) -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            setTimeout(function() {
                document.getElementById('app-wrapper').classList.add('visible');
            }, 2800);
        });
    </script>
</body>
</html>
