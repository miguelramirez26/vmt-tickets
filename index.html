<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>VMT Tickets</title>
    <meta name="theme-color" content="#f5f6f5">
    <link rel="apple-touch-icon" sizes="180x180" href="https://lh3.googleusercontent.com/d/1SlLlLRaGp9IMHT1LLPym2Ejoh8vLksTG=s512">
    <link rel="icon" href="https://lh3.googleusercontent.com/d/1SlLlLRaGp9IMHT1LLPym2Ejoh8vLksTG=s512">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="VMT Tickets">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- CABECERA -->
    <header class="topbar">
        <div class="brand">
            <span class="brand-vmt">VMT</span>
            <span class="brand-company">Pepperl+Fuchs</span>
        </div>
        <span class="internal-label">GESTIÓN INTERNA</span>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main>
        <img class="app-icon" src="https://lh3.googleusercontent.com/d/1SlLlLRaGp9IMHT1LLPym2Ejoh8vLksTG=s512" alt="VMT Tickets">
        <h1 id="matrix-title">VMT Tickets</h1>
        <p class="subtitle"> Gestión y registro de tickets </p>
        <section class="access-card">
            <p> Accede a VMT Tickets para fotografiar tus recibos, revisar la información y gestionar tus gastos. </p>
            <a class="open-button" href="https://script.google.com/macros/s/https://script.google.com/macros/s/AKfycbwlON5gl2q4scnBP1r4KMVYgdT_ed1Kg4etQpjE4ECG92rI7_2UvhZl_JFePBNs6bmE/exec" id="openLink">
                <span id="openButtonText">Abrir VMT Tickets</span>
                <span class="arrow">→</span>
            </a>
            <div class="access-note">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="10" rx="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg> Acceso mediante tu cuenta de Google </div>
        </section>
    </main>

    <!-- PIE DE PÁGINA -->
    <footer>
        <span class="footer-company">Pepperl+Fuchs</span>
        <span class="footer-tagline">Tus gastos, simplificados</span>
    </footer>

    <!-- SCRIPT DE INTERACCIÓN DINÁMICA -->
    <script src="script.js"></script>
</body>
</html>
